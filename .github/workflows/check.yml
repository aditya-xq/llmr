name: Check

on:
  push:
    branches: [develop, main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Compile all test targets
        run: cargo test --locked --no-run

      - name: Unit tests (no Docker required)
        run: cargo test --locked --lib

  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate commit messages (conventional commits)
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pattern='^(feat|feature|fix|perf|revert|chore|docs|style|refactor|test|build|ci)(\([^)]+\))?!?: .+|^Revert ".*"'

          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error file=.,title=Invalid commit subject::${sha} \"${subject}\""
              echo "  expected: <type>(<scope>): <summary> | types: feat feature fix perf revert chore docs style refactor test build ci"
              bad=$((bad + 1))
            fi
          done < <(git log --no-merges --format='%h %s' "${base}..${head}")

          if [ "$bad" -gt 0 ]; then
            echo "::error::${bad} commit(s) failed conventional-commit validation. Releases derive semver from these subjects - fix with: git rebase -i ${base}"
            exit 1
          fi
          echo "All commit subjects are conventional"

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ github.token }}
