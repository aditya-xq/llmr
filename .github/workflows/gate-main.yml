name: Gate Main

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  develop-only:
    name: develop-only
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is develop
        run: |
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          head_ref="${{ github.event.pull_request.head.ref }}"
          if [ "$head_ref" = "develop" ] && [ "$head_repo" = "${{ github.repository }}" ]; then
            echo "OK: ${head_repo}:${head_ref} may merge into main"
          else
            echo "::error::Only ${{ github.repository }}:develop may be merged into main (got ${head_repo}:${head_ref})"
            exit 1
          fi
