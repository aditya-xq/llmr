name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only (no publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Version OK: $CARGO_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cargo check (locked)
        run: cargo check --locked --all-targets

  build:
    name: build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          # Native ARM runner (free for public repos).
          # If unavailable, switch to ubuntu-latest + cross-rs (cross build).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build (locked)
        run: cargo build --release --locked --target ${{ matrix.target }} --bin llmr

      - name: Codesign & notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${MACOS_CERTIFICATE}" ]; then
            echo "Signing secrets not configured - skipping codesign/notarization (unsigned build)"
            exit 0
          fi
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/llmr"

          CERT_P12="cert.p12"
          KEYCHAIN="build.keychain"
          KC_PASS="$(openssl rand -hex 16)"
          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${CERT_P12}"

          security create-keychain -p "${KC_PASS}" "${KEYCHAIN}"
          security unlock-keychain -p "${KC_PASS}" "${KEYCHAIN}"
          security import "${CERT_P12}" -k "${KEYCHAIN}" -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KC_PASS}" "${KEYCHAIN}" > /dev/null
          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          echo "Signing with identity: ${IDENTITY}"

          codesign --force --options runtime --timestamp --sign "${IDENTITY}" "${BIN}"
          codesign --verify --strict --verbose=2 "${BIN}"

          ditto -c -k --keepParent "${BIN}" bin-notarize.zip
          xcrun notarytool submit bin-notarize.zip \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          rm -f bin-notarize.zip "${CERT_P12}"
          security delete-keychain "${KEYCHAIN}" || true

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          ASSET="llmr-${{ matrix.target }}.tar.gz"
          STAGE="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/llmr" "$STAGE/llmr"
          tar -czf "$ASSET" -C "$STAGE" llmr
          rm -rf "$STAGE"
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $asset = "llmr-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/llmr.exe" -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$asset.sha256", "$hash  $asset`n")

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@49df96e17e918a15956db358890b08e61c704919 # v1.2.0
        with:
          subject-path: llmr-${{ matrix.target }}.${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llmr-${{ matrix.target }}
          path: |
            llmr-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Add install scripts
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1

      - name: Assemble checksums.txt
        working-directory: dist
        run: |
          cat *.sha256 | sort -k2 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: List release contents
        run: ls -la dist/

      - name: Create draft GitHub release
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Dry run (no publish)
        if: env.DRY_RUN == 'true' || !startsWith(github.ref, 'refs/tags/')
        run: echo "Dry run - artifacts built and packaged above, no release created"
