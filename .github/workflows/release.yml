name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only (no publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Version OK: $CARGO_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (locked)
        run: cargo check --locked --all-targets

  build:
    name: build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          # Native ARM runner (free for public repos).
          # If unavailable, switch to ubuntu-latest + cross-rs (cross build).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (locked)
        run: cargo build --release --locked --target ${{ matrix.target }} --bin llmr

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          ASSET="llmr-${{ matrix.target }}.tar.gz"
          STAGE="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/llmr" "$STAGE/llmr"
          tar -czf "$ASSET" -C "$STAGE" llmr
          rm -rf "$STAGE"
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $asset = "llmr-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/llmr.exe" -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$asset.sha256", "$hash  $asset`n")

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: llmr-${{ matrix.target }}
          path: |
            llmr-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Add install scripts
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1

      - name: Assemble checksums.txt
        working-directory: dist
        run: |
          cat *.sha256 | sort -k2 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: List release contents
        run: ls -la dist/

      - name: Create draft GitHub release
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Dry run (no publish)
        if: env.DRY_RUN == 'true' || !startsWith(github.ref, 'refs/tags/')
        run: echo "Dry run - artifacts built and packaged above, no release created"
