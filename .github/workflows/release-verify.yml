name: Release Verify

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all assets are downloadable
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ASSETS=(
            "llmr-x86_64-pc-windows-msvc.zip"
            "llmr-x86_64-unknown-linux-gnu.tar.gz"
            "llmr-aarch64-unknown-linux-gnu.tar.gz"
            "llmr-x86_64-apple-darwin.tar.gz"
            "llmr-aarch64-apple-darwin.tar.gz"
            "checksums.txt"
          )

          failed=0
          for asset in "${ASSETS[@]}"; do
            url="https://github.com/${GH_REPO}/releases/download/${TAG}/${asset}"
            if curl -fsIL --retry 3 --retry-delay 2 "$url" > /dev/null; then
              echo "OK   $asset"
            else
              echo "FAIL $asset ($url)"
              failed=1
            fi
          done

          exit $failed

  update-homebrew:
    runs-on: ubuntu-latest
    needs: verify-assets
    if: vars.HOMEBREW_TAP_REPOSITORY != ''
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          fetch-depth: 0

      - name: Generate and push Formula/llmr.rb
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sums="$(curl -fsSL --retry 3 "https://github.com/${REPO}/releases/download/${TAG}/checksums.txt")"
          sum() { printf '%s\n' "$sums" | awk -v a="$1" '$NF == a {print $1}'; }
          sha_intel="$(sum llmr-x86_64-apple-darwin.tar.gz)"
          sha_arm="$(sum llmr-aarch64-apple-darwin.tar.gz)"
          [ -n "$sha_intel" ] && [ -n "$sha_arm" ] || { echo "::error::Missing macOS checksums"; exit 1; }

          mkdir -p Formula
          cat > Formula/llmr.rb <<EOF
          class Llmr < Formula
            desc "Drop a GGUF in. Get an API out."
            homepage "https://github.com/${REPO}"
            version "${version}"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/${REPO}/releases/download/${TAG}/llmr-x86_64-apple-darwin.tar.gz"
                sha256 "${sha_intel}"
              else
                url "https://github.com/${REPO}/releases/download/${TAG}/llmr-aarch64-apple-darwin.tar.gz"
                sha256 "${sha_arm}"
              end
            end

            def install
              bin.install "llmr"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/llmr version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/llmr.rb
          git diff --cached --quiet && echo "Formula unchanged" && exit 0
          git commit -m "chore: llmr ${TAG}"
          git push
